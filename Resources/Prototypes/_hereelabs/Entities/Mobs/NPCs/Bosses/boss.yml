- type: entity
  parent: [ SimpleSpaceMobBase, MobCombat ]
  name: Amalgam
  description: Your mind doesn't want to look at this. Your instincts tell you to shoot at it. You swore you saw all of its eyes staring at you.
  suffix: BOSS, Fleshmob
  id: MobBossFleshmob
  components:
  - type: HTN
    rootTask:
      task: SimpleHostileCompound
    blackboard:
      NavSmash: !type:Bool
        true
  - type: MeleeWeapon
    soundHit:
      path: /Audio/Weapons/Xeno/alien_claw_flesh3.ogg
    damage:
      types:
        Piercing: 10
        Slash: 10
        Blunt: 10
        Structural: 100
  - type: MovementSpeedModifier
    baseWalkSpeed: 0.4
    baseSprintSpeed: 1.2
  - type: MobThresholds
    thresholds:
      0: Alive
      6000: Dead # 30 humans worth of health
  - type: Sprite
    drawdepth: Mobs
    sprite: _hereelabs/Mobs/Aliens/fleshmob.rsi
    noRot: true
    layers:
    - map: [ "enum.DamageStateVisualLayers.Base" ]
      state: fleshmob_alive
  - type: DamageStateVisuals
    states:
      Alive:
        Base: fleshmob_alive
      Dead:
        Base: fleshmob_dead
  - type: NpcFactionMember
    factions:
    - Amalgam
  - type: FootstepModifier
    footstepSoundCollection:
      collection: FootstepSlime
  - type: Tag
    tags:
    - FootstepSound
    - DoorBumpOpener
    - CannotSuicide
  - type: Butcherable
    butcheringType: Knife
    spawned:
    - id: FoodMeatAnomaly
      amount: 20
  - type: Bloodstream
    bloodReagent: Blood
    bloodlossDamage:
      types:
        Bloodloss:
          0.5
    bloodlossHealDamage:
      types:
        Bloodloss:
          -1
  - type: Speech
    speechVerb: Slime
    speechSounds: Slime
  - type: TypingIndicator
    proto: slime # melty human...
  - type: NightVision
    isActive: true
    toggleAction: null
    color: "#8B0000"
    activateSound: null
    deactivateSound: null
  - type: ThermalVision
    isActive: true
    toggleAction: null
    color: "#8B0000"
    activateSound: null
    deactivateSound: null
  - type: Devourer
    foodPreference: Humanoid
    shouldStoreDevoured: true
    chemical: Ichor
    healRate: 15.0
    whitelist:
      components:
      - MobState
      - Door
      - Item
      tags:
      - Wall
  - type: Fleshmob
    SpawnAmalgamAction: ActionSpawnAmalgamFloaters

- type: entity
  parent: BaseAction
  id: ActionSpawnAmalgam
  name: Split
  description: We split ourselves.
  components:
  - type: InstantAction
    icon:
      sprite: _hereelabs/Mobs/Aliens/amalgams.rsi
      state: floater_alive
    event: !type:FleshmobSpawnAmalgamActionEvent
    useDelay: 20
    priority: 2
